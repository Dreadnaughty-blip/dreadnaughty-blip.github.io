name: Wekelijkse Vacature Scraper

on:
  schedule:
    # Elke maandag om 08:00 UTC (09:00 wintertijd / 10:00 zomertijd in NL)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Dit maakt handmatig starten via de GitHub Actions-knop mogelijk

permissions:
  contents: write # Cruciaal om bekende_vacatures.json automatisch te kunnen updaten

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Code ophalen uit repository
      uses: actions/checkout@v4 # Volledig compatibel met Node24

    - name: Python instellen
      uses: actions/setup-python@v5 # Volledig compatibel met Node24
      with:
        python-version: '3.10'

    - name: Afhankelijkheden installeren
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Scraper uitvoeren
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python vacature_scraper_telegram_v2.py

    - name: Database met bekende vacatures opslaan en pushen
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add bekende_vacatures.json
        # Commit en push alleen als er daadwerkelijk een nieuwe vacature is gevonden (om loze commits te voorkomen)
        git diff --quiet && git diff --staged --quiet || (git commit -m "Database met bekende vacatures bijgewerkt [skip ci]" && git push)
