name: TenderNed Extrapolatie Workflow

on:
  schedule:
    - cron: '0 4 * * 1' # Draait wekelijks op maandagochtend om 04:00
  workflow_dispatch:      # Hiermee kun je de flow altijd met de hand triggeren via GitHub

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Afhankelijkheden installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scraper en Extrapolatie uitvoeren
        run: python scraper.py

      - name: Dashboard committen en publiceren
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action Bot"
          git add index.html
          git commit -m "Auto-update: Tender forecast dashboard [skip ci]" || exit 0
          git push origin main
